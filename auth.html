<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOBLEX - Authentication & Access Gateway</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#05050a] text-white min-h-screen flex items-center justify-center p-3 sm:p-6 py-8 relative overflow-x-hidden">

  <!-- 3D Starfield Background -->
  <div id="three-canvas-container"></div>

  <!-- Auth Card -->
  <div class="relative z-10 w-full max-w-md p-5 sm:p-8 rounded-3xl bg-gray-900/90 border border-purple-500/30 backdrop-blur-xl shadow-2xl my-auto">
    <!-- Header Logo -->
    <div class="flex items-center justify-between mb-5 pb-3 border-b border-gray-800">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-2.5 h-7 bg-indigo-500 rounded-sm shadow-[0_0_10px_#6366f1]"></div>
        <div>
          <span class="text-xl sm:text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-400 uppercase block">
            JOBLEX
          </span>
          <span class="text-[9px] text-gray-400 block tracking-widest uppercase font-semibold">
            Access Gateway
          </span>
        </div>
      </a>
      <div class="flex items-center gap-2">
        <button onclick="JoblexAPI.setLang(JoblexAPI.getLang() === 'en' ? 'hi' : 'en')" class="text-xs text-purple-300 hover:text-white px-2.5 py-1 rounded-xl border border-purple-500/30 transition font-medium">
          🌐 EN / हिंदी
        </button>
        <a href="index.html" class="text-xs text-gray-400 hover:text-white px-3 py-1.5 rounded-xl border border-gray-700 hover:border-gray-500 transition font-medium">
          ← Welcome
        </a>
      </div>
    </div>

    <!-- Role Selector Tabs -->
    <div class="mb-4">
      <label class="text-[11px] text-gray-400 block mb-1.5 font-bold uppercase tracking-wider">
        Select User Persona:
      </label>
      <div class="grid grid-cols-3 gap-1.5 p-1 bg-black/50 rounded-xl border border-gray-800" id="role-tabs">
        <button type="button" onclick="selectRole('student')" id="tab-student" class="py-2 text-xs font-bold rounded-lg transition border border-purple-500/60 bg-purple-950/50 text-purple-300">
          🎓 Student
        </button>
        <button type="button" onclick="selectRole('academy')" id="tab-academy" class="py-2 text-xs font-bold rounded-lg transition border border-transparent text-gray-400 hover:text-gray-200">
          🏛️ Academy
        </button>
        <button type="button" onclick="selectRole('industry')" id="tab-industry" class="py-2 text-xs font-bold rounded-lg transition border border-transparent text-gray-400 hover:text-gray-200">
          🏢 Industry
        </button>
      </div>
    </div>

    <!-- Toggle Sign In vs Register -->
    <div class="flex border-b border-gray-800 mb-4">
      <button id="btn-mode-login" onclick="setAuthMode('login')" class="flex-1 pb-2 text-xs sm:text-sm font-bold border-b-2 border-purple-500 text-purple-300 transition">
        Sign In
      </button>
      <button id="btn-mode-register" onclick="setAuthMode('register')" class="flex-1 pb-2 text-xs sm:text-sm font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition">
        Create Account
      </button>
    </div>

    <!-- Auth Form -->
    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
      <div id="field-name" class="hidden">
        <label class="text-xs font-semibold text-gray-300 block mb-1">Full Name</label>
        <input type="text" id="input-name" placeholder="e.g. Ashay Verma" class="w-full p-2.5 rounded-xl bg-gray-950 border border-gray-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>

      <div id="field-org" class="hidden">
        <label id="label-org" class="text-xs font-semibold text-gray-300 block mb-1">College / University</label>
        <input type="text" id="input-org" placeholder="e.g. AIIA New Delhi" class="w-full p-2.5 rounded-xl bg-gray-950 border border-gray-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-300 block mb-1">Email Address</label>
        <input type="email" id="input-email" required value="student@nexus.edu" placeholder="user@nexus.edu" class="w-full p-2.5 rounded-xl bg-gray-950 border border-gray-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-300 block mb-1">Password</label>
        <input type="password" id="input-password" required value="password123" placeholder="••••••••" class="w-full p-2.5 rounded-xl bg-gray-950 border border-gray-700 text-xs text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 hover:opacity-95 text-white font-bold text-xs sm:text-sm shadow-md transition mt-2">
        Sign In as STUDENT
      </button>
    </form>

    <!-- 1-Click Fast Login Section for SIH Judges -->
    <div class="mt-5 pt-4 border-t border-gray-800">
      <p class="text-[11px] text-center text-gray-400 mb-2 font-semibold">
        ⚡ 1-Click Demo Logins for SIH Judges:
      </p>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" onclick="quickDemoLogin('student')" class="p-2 text-[11px] rounded-lg bg-purple-900/30 hover:bg-purple-900/60 border border-purple-500/40 text-purple-200 font-bold transition text-center">
          Demo Student
        </button>
        <button type="button" onclick="quickDemoLogin('academy')" class="p-2 text-[11px] rounded-lg bg-emerald-900/30 hover:bg-emerald-900/60 border border-emerald-500/40 text-emerald-200 font-bold transition text-center">
          Demo Academic
        </button>
        <button type="button" onclick="quickDemoLogin('industry')" class="p-2 text-[11px] rounded-lg bg-blue-900/30 hover:bg-blue-900/60 border border-blue-500/40 text-blue-200 font-bold transition text-center">
          Demo Industry
        </button>
      </div>
    </div>
  </div>

  <!-- Frontend Scripts (Cleanly separated from Backend) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/frontend/three-scene.js"></script>
  <script src="js/frontend/api-client.js"></script>
  <script>
    let currentRole = 'student';
    let isLoginMode = true;

    function selectRole(role) {
      currentRole = role;
      const roles = ['student', 'academy', 'industry'];
      const styles = {
        student: 'border-purple-500/60 bg-purple-950/50 text-purple-300',
        academy: 'border-emerald-500/60 bg-emerald-950/50 text-emerald-300',
        industry: 'border-blue-500/60 bg-blue-950/50 text-blue-300'
      };

      roles.forEach(r => {
        const btn = document.getElementById(`tab-${r}`);
        if (r === role) {
          btn.className = `py-2 text-xs font-bold rounded-lg transition border ${styles[r]}`;
        } else {
          btn.className = 'py-2 text-xs font-bold rounded-lg transition border border-transparent text-gray-400 hover:text-gray-200';
        }
      });

      // Update demo email
      const demoEmails = {
        student: 'student@nexus.edu',
        academy: 'dean@aiia.gov.in',
        industry: 'hr@dabur-research.com'
      };
      document.getElementById('input-email').value = demoEmails[role];

      // Update label
      const orgLabel = document.getElementById('label-org');
      if (orgLabel) {
        orgLabel.innerText = role === 'industry' ? 'Company Name' : 'College / University';
      }

      updateSubmitButtonText();
    }

    function setAuthMode(mode) {
      isLoginMode = mode === 'login';
      const btnLogin = document.getElementById('btn-mode-login');
      const btnReg = document.getElementById('btn-mode-register');
      const fieldName = document.getElementById('field-name');
      const fieldOrg = document.getElementById('field-org');

      if (isLoginMode) {
        btnLogin.className = 'flex-1 pb-2 text-xs sm:text-sm font-bold border-b-2 border-purple-500 text-purple-300 transition';
        btnReg.className = 'flex-1 pb-2 text-xs sm:text-sm font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition';
        fieldName.classList.add('hidden');
        fieldOrg.classList.add('hidden');
      } else {
        btnReg.className = 'flex-1 pb-2 text-xs sm:text-sm font-bold border-b-2 border-purple-500 text-purple-300 transition';
        btnLogin.className = 'flex-1 pb-2 text-xs sm:text-sm font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition';
        fieldName.classList.remove('hidden');
        fieldOrg.classList.remove('hidden');
      }
      updateSubmitButtonText();
    }

    function updateSubmitButtonText() {
      const btn = document.getElementById('submit-btn');
      btn.innerText = isLoginMode 
        ? `Sign In as ${currentRole.toUpperCase()}`
        : `Register & Enter ${currentRole.toUpperCase()} Portal`;
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value;
      const password = document.getElementById('input-password').value;

      await JoblexAPI.login(email, password, currentRole);
      redirectToPortal(currentRole);
    }

    function quickDemoLogin(role) {
      const demoAccounts = {
        student: { email: 'student@nexus.edu', role: 'student' },
        academy: { email: 'dean@aiia.gov.in', role: 'academy' },
        industry: { email: 'hr@dabur-research.com', role: 'industry' }
      };
      const account = demoAccounts[role];
      JoblexAPI.setCurrentUser(JoblexAPI.demoUsers[role]);
      redirectToPortal(role);
    }

    function redirectToPortal(role) {
      if (role === 'student') window.location.href = 'student.html';
      else if (role === 'academy') window.location.href = 'academy.html';
      else if (role === 'industry') window.location.href = 'industry.html';
      else window.location.href = 'student.html';
    }
  </script>
</body>
</html>
