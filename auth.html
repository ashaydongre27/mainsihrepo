<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOBLEX - Authentication & Access Gateway</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="/js/frontend/theme.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  
</head>
<body class="bg-gradient-to-b from-[#FFFFFF] via-[#F8F9FA] to-[#F1F3F5] dark:from-[#0B0D11] dark:via-[#111317] dark:to-[#1A1C20] text-[#111827] dark:text-[#E2E2E8] min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-[#E2E8F0] dark:selection:bg-[#333539] selection:text-[#0F172A] dark:selection:text-[#ADC6FF] transition-colors duration-200">

  <!-- Top Minimal Utility Bar -->
  <header class="w-full max-w-5xl mx-auto px-6 py-5 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2.5 text-[#0F172A] dark:text-[#E2E2E8] hover:opacity-80 transition-opacity">
      <span class="w-6 h-6 bg-[#0F172A] dark:bg-[#ADC6FF] text-white dark:text-[#002E6A] flex items-center justify-center rounded text-xs font-mono font-bold">J</span>
      <span class="text-base font-bold tracking-tight uppercase">JOBLEX</span>
      <span class="text-[11px] text-[#64748B] dark:text-[#8C909F] pl-2 border-l border-[#E2E8F0] dark:border-[#333539]">National Ayush Gateway</span>
    </a>
    <div class="flex items-center gap-3">
      <!-- Theme Toggle Button -->
      <button id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Light/Dark Theme" title="Toggle Light/Dark Theme" class="p-1.5 rounded-lg border border-[#E2E8F0] dark:border-[#333539] bg-white dark:bg-[#1A1C20] text-[#475569] dark:text-[#C2C6D6] hover:text-[#0F172A] dark:hover:text-white transition-colors duration-150 flex items-center justify-center">
        <span id="theme-toggle-icon" class="material-symbols-outlined text-[18px]">dark_mode</span>
      </button>
      <a href="src\students\student-roadmap.html" class="text-xs text-[#475569] dark:text-[#8C909F] hover:text-[#0F172A] dark:hover:text-white font-medium transition-colors">
        Direct Roadmap Access ➔
      </a>
    </div>
  </header>

  <!-- Centered Auth Card Container -->
  <main class="w-full max-w-lg mx-auto px-4 py-8 flex-1 flex items-center justify-center">
    <div id="auth-card-container" class="w-full bg-[#FFFFFF] dark:bg-[#111317] border border-[#E5E7EB] dark:border-[#282A2E] rounded-2xl p-6 sm:p-8 shadow-[0_1px_3px_rgba(0,0,0,0.05),0_10px_25px_-5px_rgba(0,0,0,0.03)] dark:shadow-none transition-all duration-200">
      
      <!-- Institutional Header Lockup -->
      <div class="border-b border-[#F1F5F9] dark:border-[#282A2E] pb-5 mb-5 text-center">
        <div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-[#F8FAFC] dark:bg-[#1A1C20] border border-[#E2E8F0] dark:border-[#333539] text-[#0F172A] dark:text-[#ADC6FF] mb-3">
          <span class="text-base font-mono">🔐</span>
        </div>
        <h1 class="text-xl font-bold text-[#0F172A] dark:text-[#E2E2E8] tracking-tight">Institutional Access Gateway</h1>
        <p id="gateway-subtitle" class="text-xs text-[#64748B] dark:text-[#8C909F] mt-1">
          Ministry of Ayush & Accredited Collegiate Verification Framework
        </p>
      </div>

      <!-- Mode Selector Tabs (Login / Register) -->
      <div class="grid grid-cols-2 gap-1 p-1 bg-[#F8FAFC] dark:bg-[#1A1C20] rounded-xl border border-[#E2E8F0] dark:border-[#333539] mb-5">
        <button type="button" id="btn-mode-login" onclick="setAuthMode('login')" class="py-2 text-xs font-semibold rounded-lg transition-all bg-[#0F172A] dark:bg-[#ADC6FF] text-white dark:text-[#002E6A] shadow-sm">
          Sign In
        </button>
        <button type="button" id="btn-mode-register" onclick="setAuthMode('register')" class="py-2 text-xs font-semibold rounded-lg transition-all text-[#64748B] dark:text-[#8C909F] hover:text-[#0F172A] dark:hover:text-[#E2E2E8]">
          Create Account
        </button>
      </div>

      <!-- Context Notice -->
      <div id="mode-context-banner" class="mb-5 p-3 rounded-xl bg-[#F8FAFC] dark:bg-[#1A1C20] border border-[#E2E8F0] dark:border-[#333539] text-xs text-[#475569] dark:text-[#C2C6D6] flex items-center justify-between">
        <span id="banner-text">Institutional Credentials required for verified outcome tracking.</span>
        <span class="text-[10px] font-mono text-[#0F172A] dark:text-[#ADC6FF] bg-[#E2E8F0] dark:bg-[#282A2E] px-1.5 py-0.5 rounded font-semibold">NAAC Cycle IV</span>
      </div>

      <!-- Persona / Role Selector -->
      <div class="mb-4">
        <div class="flex justify-between items-center mb-1.5">
          <label id="role-selector-label" class="text-[11px] font-semibold text-[#475569] dark:text-[#8C909F] uppercase tracking-wider">
            Sign In Portal:
          </label>
          <span id="role-hint-badge" class="text-[10px] font-mono font-medium px-2 py-0.5 rounded-full bg-[#ECFDF5] dark:bg-[#003824]/40 text-[#065F46] dark:text-[#4EDEA3] border border-[#A7F3D0] dark:border-[#00A572]/40">
            Ayush Student
          </span>
        </div>
        <div class="grid grid-cols-3 gap-1.5 p-1 bg-[#F8FAFC] dark:bg-[#1A1C20] rounded-xl border border-[#E2E8F0] dark:border-[#333539]" id="role-tabs">
          <button type="button" onclick="selectRole('student')" id="tab-student" class="py-2 text-xs font-semibold rounded-lg transition border border-[#0F172A] dark:border-[#ADC6FF] bg-[#FFFFFF] dark:bg-[#1E2024] text-[#0F172A] dark:text-[#ADC6FF] shadow-sm">
            Student
          </button>
          <button type="button" onclick="selectRole('academy')" id="tab-academy" class="py-2 text-xs font-semibold rounded-lg transition border border-transparent text-[#64748B] dark:text-[#8C909F] hover:text-[#0F172A] dark:hover:text-[#E2E2E8]">
            Academy / Dean
          </button>
          <button type="button" onclick="selectRole('industry')" id="tab-industry" class="py-2 text-xs font-semibold rounded-lg transition border border-transparent text-[#64748B] dark:text-[#8C909F] hover:text-[#0F172A] dark:hover:text-[#E2E2E8]">
            Pharma R&D
          </button>
        </div>
      </div>

      <!-- Auth Form -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3.5">
        
        <!-- Register Extended Fields -->
        <div id="register-fields" class="hidden space-y-3 pt-1">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="text-[11px] font-semibold text-[#475569] dark:text-[#8C909F] uppercase tracking-wider block mb-1">
                Full Legal Name <span class="text-rose-500">*</span>
              </label>
              <input type="text" id="input-name" placeholder="e.g. Ashay Verma" class="w-full p-2.5 rounded-xl bg-[#FFFFFF] dark:bg-[#0C0E12] border border-[#E2E8F0] dark:border-[#333539] text-xs text-[#0F172A] dark:text-[#E2E2E8] placeholder:text-[#94A3B8] dark:placeholder:text-[#545F73] focus:outline-none focus:border-[#0F172A] dark:focus:border-[#ADC6FF] focus:ring-1 focus:ring-[#0F172A] dark:focus:ring-[#ADC6FF]">
            </div>
            <div>
              <label id="label-org" class="text-[11px] font-semibold text-[#475569] dark:text-[#8C909F] uppercase tracking-wider block mb-1">
                College / Institution <span class="text-rose-500">*</span>
              </label>
              <input type="text" id="input-org" placeholder="e.g. AIIA New Delhi" class="w-full p-2.5 rounded-xl bg-[#FFFFFF] dark:bg-[#0C0E12] border border-[#E2E8F0] dark:border-[#333539] text-xs text-[#0F172A] dark:text-[#E2E2E8] placeholder:text-[#94A3B8] dark:placeholder:text-[#545F73] focus:outline-none focus:border-[#0F172A] dark:focus:border-[#ADC6FF] focus:ring-1 focus:ring-[#0F172A] dark:focus:ring-[#ADC6FF]">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label id="label-dept" class="text-[11px] font-semibold text-[#475569] dark:text-[#8C909F] uppercase tracking-wider block mb-1">
                Department / Faculty
              </label>
              <input type="text" id="input-dept" placeholder="e.g. Ayurvedic Pharmacology" class="w-full p-2.5 rounded-xl bg-[#FFFFFF] dark:bg-[#0C0E12] border border-[#E2E8F0] dark:border-[#333539] text-xs text-[#0F172A] dark:text-[#E2E2E8] placeholder:text-[#94A3B8] dark:placeholder:text-[#545F73] focus:outline-none focus:border-[#0F172A] dark:focus:border-[#ADC6FF] focus:ring-1 focus:ring-[#0F172A] dark:focus:ring-[#ADC6FF]">
            </div>
            <div>
              <label id="label-role-spec" class="text-[11px] font-semibold text-[#475569] dark:text-[#8C909F] uppercase tracking-wider block mb-1">
                Academic Year / Title
              </label>
              <input type="text" id="input-role-spec" placeholder="e.g. 3rd Year BAMS" class="w-full p-2.5 rounded-xl bg-[#FFFFFF] dark:bg-[#0C0E12] border border-[#E2E8F0] dark:border-[#333539] text-xs text-[#0F172A] dark:text-[#E2E2E8] placeholder:text-[#94A3B8] dark:placeholder:text-[#545F73] focus:outline-none focus:border-[#0F172A] dark:focus:border-[#ADC6FF] focus:ring-1 focus:ring-[#0F172A] dark:focus:ring-[#ADC6FF]">
            </div>
          </div>
        </div>

        <!-- Primary Credentials -->
        <div>
          <label class="text-[11px] font-semibold text-[#475569] dark:text-[#8C909F] uppercase tracking-wider block mb-1">
            Institutional Email Address <span class="text-rose-500">*</span>
          </label>
          <input type="email" id="input-email" required placeholder="ashay.verma@aiia.gov.in" class="w-full p-2.5 rounded-xl bg-[#FFFFFF] dark:bg-[#0C0E12] border border-[#E2E8F0] dark:border-[#333539] text-xs text-[#0F172A] dark:text-[#E2E2E8] font-mono placeholder:text-[#94A3B8] dark:placeholder:text-[#545F73] focus:outline-none focus:border-[#0F172A] dark:focus:border-[#ADC6FF] focus:ring-1 focus:ring-[#0F172A] dark:focus:ring-[#ADC6FF]">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-[11px] font-semibold text-[#475569] dark:text-[#8C909F] uppercase tracking-wider block">
              Password <span class="text-rose-500">*</span>
            </label>
            <span id="login-forgot-pass" class="text-[11px] text-[#64748B] dark:text-[#8C909F] hover:text-[#0F172A] dark:hover:text-white cursor-pointer">
              Forgot?
            </span>
          </div>
          <input type="password" id="input-password" required placeholder="••••••••••••" class="w-full p-2.5 rounded-xl bg-[#FFFFFF] dark:bg-[#0C0E12] border border-[#E2E8F0] dark:border-[#333539] text-xs text-[#0F172A] dark:text-[#E2E2E8] placeholder:text-[#94A3B8] dark:placeholder:text-[#545F73] focus:outline-none focus:border-[#0F172A] dark:focus:border-[#ADC6FF] focus:ring-1 focus:ring-[#0F172A] dark:focus:ring-[#ADC6FF]">
        </div>

        <!-- Terms Agreement Checkbox -->
        <div id="register-terms" class="hidden text-[11px] text-[#64748B] dark:text-[#8C909F] flex items-start gap-2 pt-1">
          <input type="checkbox" id="terms-agree" class="mt-0.5 rounded border-[#CBD5E1] dark:border-[#333539] text-[#0F172A] dark:text-[#ADC6FF] focus:ring-[#0F172A] dark:focus:ring-[#ADC6FF]">
          <label for="terms-agree">
            I certify my institutional affiliation under Ministry of Ayush / NAAC statutory guidelines.
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="w-full py-2.5 rounded-xl bg-[#0F172A] dark:bg-[#ADC6FF] hover:bg-[#1E293B] dark:hover:bg-[#D8E2FF] text-white dark:text-[#002E6A] font-semibold text-xs tracking-wide shadow-none transition-colors duration-150 mt-3 flex items-center justify-center gap-2 cursor-pointer">
          <span>Authenticate to Student Portal ➔</span>
        </button>

        <!-- Switch Mode Link -->
        <div class="text-center pt-2 text-xs text-[#64748B] dark:text-[#8C909F]">
          <span id="switch-mode-prompt">Need an institutional account?</span>
          <button type="button" id="switch-mode-action" onclick="toggleAuthMode()" class="ml-1 text-[#0F172A] dark:text-[#ADC6FF] font-semibold hover:underline cursor-pointer">
            Register Here
          </button>
        </div>
    </div>
  </main>

  <!-- Script Implementation -->
  <script src="js/frontend/api-client.js"></script>
  <script src="js/frontend/notifications.js"></script>
  <script>
    let currentMode = 'login';
    let selectedRole = 'student';

    function setAuthMode(mode) {
      currentMode = mode;
      const btnLogin = document.getElementById('btn-mode-login');
      const btnRegister = document.getElementById('btn-mode-register');
      const registerFields = document.getElementById('register-fields');
      const registerTerms = document.getElementById('register-terms');
      const submitBtn = document.getElementById('submit-btn');
      const switchPrompt = document.getElementById('switch-mode-prompt');
      const switchAction = document.getElementById('switch-mode-action');

      if (mode === 'login') {
        btnLogin.className = "py-2 text-xs font-semibold rounded-lg transition-all bg-[#0F172A] dark:bg-[#ADC6FF] text-white dark:text-[#002E6A] shadow-sm";
        btnRegister.className = "py-2 text-xs font-semibold rounded-lg transition-all text-[#64748B] dark:text-[#8C909F] hover:text-[#0F172A] dark:hover:text-[#E2E2E8]";
        registerFields.classList.add('hidden');
        registerTerms.classList.add('hidden');
        submitBtn.querySelector('span').textContent = `Authenticate to ${capitalize(selectedRole)} Portal ➔`;
        switchPrompt.textContent = "Need an institutional account?";
        switchAction.textContent = "Register Here";
      } else {
        btnRegister.className = "py-2 text-xs font-semibold rounded-lg transition-all bg-[#0F172A] dark:bg-[#ADC6FF] text-white dark:text-[#002E6A] shadow-sm";
        btnLogin.className = "py-2 text-xs font-semibold rounded-lg transition-all text-[#64748B] dark:text-[#8C909F] hover:text-[#0F172A] dark:hover:text-[#E2E2E8]";
        registerFields.classList.remove('hidden');
        registerTerms.classList.remove('hidden');
        submitBtn.querySelector('span').textContent = `Create & Register ${capitalize(selectedRole)} Account ➔`;
        switchPrompt.textContent = "Already have an institutional account?";
        switchAction.textContent = "Sign In Here";
      }
    }

    function toggleAuthMode() {
      setAuthMode(currentMode === 'login' ? 'register' : 'login');
    }

    function selectRole(role) {
      selectedRole = role;
      const roles = ['student', 'academy', 'industry'];
      roles.forEach(r => {
        const tab = document.getElementById(`tab-${r}`);
        if (tab) {
          if (r === role) {
            tab.className = "py-2 text-xs font-semibold rounded-lg transition border border-[#0F172A] dark:border-[#ADC6FF] bg-[#FFFFFF] dark:bg-[#1E2024] text-[#0F172A] dark:text-[#ADC6FF] shadow-sm";
          } else {
            tab.className = "py-2 text-xs font-semibold rounded-lg transition border border-transparent text-[#64748B] dark:text-[#8C909F] hover:text-[#0F172A] dark:hover:text-[#E2E2E8]";
          }
        }
      });

      const badge = document.getElementById('role-hint-badge');
      if (badge) {
        if (role === 'student') badge.textContent = 'Ayush Student';
        else if (role === 'academy') badge.textContent = 'Collegiate Academy / Dean';
        else badge.textContent = 'Pharma R&D Industry';
      }

      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) {
        submitBtn.querySelector('span').textContent = currentMode === 'login' 
          ? `Authenticate to ${capitalize(role)} Portal ➔`
          : `Create & Register ${capitalize(role)} Account ➔`;
      }

      // Auto pre-fill demo email/password if on login mode and fields are empty or match defaults
      if (currentMode === 'login') {
        const emailInput = document.getElementById('input-email');
        const passInput = document.getElementById('input-password');
        if (emailInput && (!emailInput.value || emailInput.value.includes('@nexus.edu') || emailInput.value.includes('aiia.gov.in'))) {
          emailInput.value = `${role}@nexus.edu`;
          passInput.value = "password123";
        }
      }
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const submitBtn = document.getElementById('submit-btn');

      if (!email || !password) {
        alert('Please provide both email address and password.');
        return;
      }

      const originalText = submitBtn.querySelector('span').textContent;
      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Authenticating...';

      try {
        if (currentMode === 'login') {
          const res = await JoblexApiClient.login(email, password, selectedRole);
          const redirect = new URLSearchParams(window.location.search).get('redirect') || `${res.user.role}.html`;
          window.location.href = redirect;
        } else {
          const name = document.getElementById('input-name').value.trim();
          const org = document.getElementById('input-org').value.trim();
          const dept = document.getElementById('input-dept').value.trim();
          const roleSpec = document.getElementById('input-role-spec').value.trim();

          if (!name || !org) {
            alert('Full Legal Name and College / Institution are required for registration.');
            submitBtn.disabled = false;
            submitBtn.querySelector('span').textContent = originalText;
            return;
          }

          const userData = {
            name,
            email,
            password,
            role: selectedRole,
            institution: selectedRole === 'industry' ? null : org,
            company: selectedRole === 'industry' ? org : null,
            department: dept,
            year: selectedRole === 'student' ? roleSpec : null,
            designation: selectedRole !== 'student' ? roleSpec : null
          };

          const res = await JoblexApiClient.register(userData);
          const redirect = new URLSearchParams(window.location.search).get('redirect') || `${res.user.role}.html`;
          window.location.href = redirect;
        }
      } catch (err) {
        alert(err.message || 'Authentication error. Please check your credentials.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.querySelector('span').textContent = originalText;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = urlParams.get('role');
      if (roleParam && ['student', 'academy', 'industry'].includes(roleParam.toLowerCase())) {
        selectRole(roleParam.toLowerCase());
      } else {
        selectRole('student');
      }
    });
  </script>
</body>
</html>
